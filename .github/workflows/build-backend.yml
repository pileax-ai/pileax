name: Build Backend Only

on:
  workflow_dispatch:

jobs:

  # ------------------------
  # Build backend per OS
  # ------------------------
  backend:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64  # Native M1/M2 build
          - os: macos-latest
            arch: x86_64 # Emulated Intel build via Rosetta 2
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare env files
        run: |
          cp backend/.env.example backend/.env
          cp frontend/env/.env.example frontend/env/.env

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Build backend
        shell: bash
        run: |
          cd backend
          # Use arch command for macOS x86_64 specifically
          PREFIX=""
          if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.arch }}" == "x86_64" ]]; then
            PREFIX="arch -x86_64"
          fi

          # Ensure the environment and commands run under the correct architecture
          $PREFIX python -m venv .venv

          if [ -f ".venv/bin/python" ]; then
            VENV_PY=".venv/bin/python"
          else
            VENV_PY=".venv/Scripts/python.exe"
          fi

          $PREFIX $VENV_PY -m pip install uv
          $PREFIX $VENV_PY -m uv sync
          $PREFIX $VENV_PY -m uv add --dev pyinstaller
          $PREFIX $VENV_PY -m uv run pyinstaller --noconfirm runnable.spec

      - name: Upload backend artifact
        if: ${{ env.SKIP != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.os }}-${{ matrix.arch }}
          path: backend/dist/runnable
          include-hidden-files: true
