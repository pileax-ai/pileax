name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true

run-name: Desktop Release - ${{ inputs.version || github.sha }}

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ------------------------------
      # 1. Get run ID of Build Desktop workflow
      # ------------------------------
      - name: Get latest Build Desktop Arch run ID
        id: get-run-id
        run: |
          RUN_ID=$(gh run list \
          --repo "$GITHUB_REPOSITORY" \
          --workflow="Build Desktop Arch" \
          --status=success \
          --limit=1 \
          --json databaseId \
          --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "Error: No successful Build Desktop workflow found"
            exit 1
          fi

          echo "Found run ID: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------
      # 2. Download all artifacts
      # ------------------------------
      - name: Download artifacts from latest Build
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: "Build Desktop Arch"
          run_id: ${{ env.RUN_ID }}
          path: artifacts
          skip_unpack: false

      - name: List downloaded files
        run: |
          rm -rf artifacts/backend-*
          echo "Downloaded and unzipped artifacts:"
          find artifacts -type f | sort

      # ------------------------------
      # 3. Create Github Release
      # ------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.yml
            artifacts/**/*.blockmap
          overwrite_files: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-draft:
    needs: release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release Drafter
        uses: release-drafter/release-drafter@v7.2.1
        with:
          version: ${{ inputs.version }}
          tag: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
