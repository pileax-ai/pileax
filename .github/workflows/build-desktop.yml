name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Choose target platforms'
        required: false
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
        type: choice
        options:
          - '["ubuntu-latest","macos-latest","windows-latest"]'
          - '["ubuntu-latest"]'
          - '["macos-latest"]'
          - '["windows-latest"]'
          - '["ubuntu-latest","windows-latest"]'
          - '["macos-latest","windows-latest"]'

jobs:

  # ------------------------
  # 1. Build backend per OS
  # ------------------------
  backend:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp backend/.env.example backend/.env
          cp frontend/env/.env.example frontend/env/.env

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Build backend
        shell: bash
        run: |
          cd backend
          python -m venv .venv

          if [ -f ".venv/bin/python" ]; then
            VENV_PY=".venv/bin/python"
          else
            VENV_PY=".venv/Scripts/python.exe"
          fi

          $VENV_PY -m pip install uv
          $VENV_PY -m uv sync
          $VENV_PY -m uv add --dev pyinstaller
          $VENV_PY -m uv run pyinstaller --noconfirm runnable.spec
          tar -czf runnable.tar.gz -C dist runnable

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: backend/runnable.tar.gz
          include-hidden-files: true

  # ------------------------
  # 2. Build frontend Electron
  # ------------------------
  frontend:
    needs: backend
    strategy:
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms) }}
    runs-on: ${{ matrix.os }}

    env:
      # Used for release
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Used for sign
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_IDENTITY_AUTO_DISCOVERY: true

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp backend/.env.example backend/.env
          cp frontend/env/.env.example frontend/env/.env

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: backend/.artifact

      - name: Extract backend
        shell: bash
        run: |
          rm -rf backend/dist/runnable
          mkdir -p backend/dist
          tar -xzf backend/.artifact/runnable.tar.gz -C backend/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend
          yarn install

      # ===============================
      # ⭐ macOS code sign: Import Developer ID
      # ===============================
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > certificate.p12

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

          security find-identity -v -p codesigning

      - name: Set macOS signing environment variables
        if: runner.os == 'macOS'
        run: |
          export CSC_LINK=certificate.p12
          export CSC_KEY_PASSWORD=${{ secrets.MAC_CERT_PASSWORD }}
          export CSC_IDENTITY_AUTO_DISCOVERY=true
          export APPLE_ID=${{ secrets.APPLE_ID }}
          export APPLE_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          export APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}

      - name: Pre-sign Python Backend
        if: runner.os == 'macOS'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 | awk -F '"' '{print $2}')
          echo "Using Identity: $IDENTITY"

          codesign --force --options runtime --timestamp --deep --sign "$IDENTITY" --keychain build.keychain backend/dist/runnable

      # ===============================
      # Build Electron (Auto sign)
      # ===============================
      - name: Build Electron app
        shell: bash
        run: |
          if [[ "$RUNNER_OS" != "Windows_NT" ]]; then
            chmod +x backend/dist/runnable/runnable
          fi

          cd frontend
          node_modules/.bin/electron-rebuild
          yarn build:electron

      - name: Upload Electron build
        uses: actions/upload-artifact@v4
        with:
          name: pileax-${{ matrix.os }}
          path: |
            frontend/dist/electron/Packaged/*.dmg
            frontend/dist/electron/Packaged/*.exe
            frontend/dist/electron/Packaged/*.AppImage
            frontend/dist/electron/Packaged/*.deb
            frontend/dist/electron/Packaged/*.rpm
            frontend/dist/electron/Packaged/*.blockmap
            frontend/dist/electron/Packaged/*.zip
            frontend/dist/electron/Packaged/latest*.yml
          if-no-files-found: ignore

      - name: Upload build status
        if: always()
        shell: bash
        run: |
          mkdir -p status
          echo "${{ job.status }}" > status/status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-${{ matrix.os }}
          path: status/status.txt

  # ------------------------
  # 3. Notify
  # ------------------------
  summary:
    name: Build Summary
    needs: frontend
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: status-*
          path: statuses

      - name: Build Markdown summary
        shell: bash
        run: |
          set -euo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          SUMMARY="**Build Desktop [PileaX]**\n\nRun: [查看 Actions]($RUN_URL)\n\n"

          for status_dir in $(ls -d statuses/* | sort); do
          OS=$(basename "$status_dir" | sed 's/^status-//')
          STATUS=$(cat "$status_dir/status.txt")

          if [ "$STATUS" = "success" ]; then
           ICON="✅"
          else
           ICON="❌"
          fi

          SUMMARY="$SUMMARY$ICON $OS : $STATUS\n"
          done

          # 写入 summary.md
          echo -e "$SUMMARY" > summary.md
          cat summary.md

      - name: Send Feishu summary (Markdown)
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          TEXT=$(cat summary.md)

          jq -n --arg text "$TEXT" '{
            msg_type: "post",
            content: {
              post: {
                zh_cn: {
                  title: "Build Desktop [PileaX]",
                  content: [
                    [
                      { "tag": "text", "text": $text }
                    ]
                  ]
                }
              }
            }
          }' | curl -fSs -X POST -H "Content-Type: application/json" -d @- "$FEISHU_WEBHOOK"
