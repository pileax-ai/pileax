name: DB Migration Matrix Test

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: db-migration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      revs: ${{ steps.set-revs.outputs.revs }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - id: set-revs
        run: |
          echo "revs=$(uv run --directory backend python scripts/get_alemibic_revisions.py)" >> $GITHUB_OUTPUT

  db-migration-test:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db-type: [ postgres, sqlite ]
        start_rev: ${{ fromJson(needs.generate-matrix.outputs.revs) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --project backend

      - name: Ensure Offline migration are supported
        # upgrade: from base to head
        # downgrade: from head back to base
        run: |
          uv run --directory backend alembic upgrade head --sql
          uv run --directory backend alembic downgrade head:base --sql

      - name: Prepare middleware env
        if: matrix.db-type == 'postgres'
        run: |
          cp docker/middleware.env.example docker/middleware.env

      - name: Set up Postgres Middlewares
        if: matrix.db-type == 'postgres'
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: docker/docker-compose.middleware.yaml
          services: db

      - name: Prepare configs
        run: |
          cd backend
          cp .env.example .env

      - name: Run Matrix Migration Test
        env:
          DEBUG: true
          DB_PROVIDER: ${{ matrix.db-type == 'sqlite' && 'sqlite' || 'postgresql' }}
          DB_DATABASE: ${{ matrix.db-type == 'sqlite' && './.cache/storage/metadata.db' || 'pileax' }}
        run: |
          echo "Testing path: ${{ matrix.start_rev }} -> HEAD (on ${{ matrix.db-type }})"
          if [ "${{ matrix.db-type }}" == "sqlite" ]; then
            mkdir -p backend/.cache/storage/
            echo "SQLite directory created."
          fi

          # 1. upgrade from base to rev
          uv run --directory backend alembic upgrade ${{ matrix.start_rev }}

          # 2. upgrade from rev to head
          uv run --directory backend alembic upgrade head
